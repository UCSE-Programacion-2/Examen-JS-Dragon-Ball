<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Examen JS - Dragon Ball Quiz</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="dragonball-container">
      <header>
        <h1>Dragon Ball Quiz</h1>
        <div class="score">
          <span>Poder de Pelea</span>
          <div class="score-container">
            <h2 id="score">0</h2>
            <select id="sagaSelector" class="saga-select">
              <option value="dragon-ball">Dragon Ball</option>
              <option value="dragon-ball-z">Dragon Ball Z</option>
              <option value="dragon-ball-gt">Dragon Ball GT</option>
              <option value="dragon-ball-super">Dragon Ball Super</option>
            </select>
          </div>
        </div>
      </header>

      <section class="actions">
        <button id="btnNuevo">
          <i class="fas fa-fist-raised"></i>
          Nuevo Personaje
        </button>
        <button id="btnPista">
          <i class="fas fa-eye"></i>
          Pista
        </button>
        <button id="btnHistorial">
          <i class="fas fa-scroll"></i>
          Historial
        </button>
      </section>

      <section class="quiz" id="quizSection">
        <h3>¿Quién es este personaje?</h3>
        <div class="character-view">
          <div class="image-wrapper">
            <!-- La imagen del personaje se cargará dinámicamente -->
            <img id="characterImage" alt="personaje" />
          </div>
          <div class="guess-form">
            <input
              type="text"
              id="guessInput"
              placeholder="Escribe el nombre del personaje..."
            />
            <button id="confirmarRespuesta">Confirmar</button>
          </div>
          <p id="feedback" class="feedback"></p>
        </div>
      </section>

      <!-- Modal Pista -->
      <div id="modalPista" class="modal">
        <div class="modal-content">
          <h3>Pista</h3>
          <div id="hintContent" class="hint"></div>
          <button class="cerrar-modal">Cerrar</button>
        </div>
      </div>

      <!-- Modal Historial -->
      <div id="modalHistorial" class="modal">
        <div class="modal-content">
          <h3>Historial de Batallas</h3>
          <div class="history-container" id="historyContainer">
            <!-- El historial se cargará dinámicamente -->
          </div>
          <button class="cerrar-modal">Cerrar</button>
        </div>
      </div>
    </div>

    <script src="./js/app.js"></script>
  </body>
</html>
